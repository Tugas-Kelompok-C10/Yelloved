{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/style.css">
        {% block meta %} {% endblock meta %}
    </head>

    <body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'home:show_main' %}" class="brand">{{ name }}</a>
            <nav>
                <a href="{% url 'home:show_explore' %}">Explore</a>
                <a href="{% url 'home:show_wanted' %}">Wanted</a>
                <a href="{% url 'home:show_activity' %}">Activity</a>
            </nav>
        </div>
    </header>
    {% block content %} {% endblock content %}

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
    </body>

</html>
