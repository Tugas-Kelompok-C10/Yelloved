{% extends 'base.html' %}
{% block content %}
<main class="auth-page">
    <section class="auth-card">
        <h1>Masuk</h1>
        {% if form.errors %}<p class="form-error">Username atau kata sandi tidak cocok. Silakan coba lagi.</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="form-field"><label for="id_username">Username</label>{{ form.username }}</div>
            <div class="form-field"><label for="id_password">Kata sandi</label>{{ form.password }}</div>
            <button type="submit">Masuk</button>
        </form>
        <p>Belum punya akun? <a href="{% url 'account_profile:register' %}">Daftar</a></p>
    </section>
</main>
{% endblock content %}
