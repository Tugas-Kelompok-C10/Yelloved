{% extends 'base.html' %}
{% block meta %}<title>Checkout | {{ name }}</title>{% endblock meta %}
{% block content %}
<main class="container transaction-page">
    <h1>Checkout</h1>
    <form class="checkout-form" method="get">
        <h2>Alamat Pengiriman</h2>
        <label for="recipient-name">Nama Penerima</label>
        <input id="recipient-name" type="text" name="recipient_name">

        <label for="phone">Nomor HP</label>
        <input id="phone" type="tel" name="phone">

        <label for="province">Provinsi</label>
        <select id="province" name="province"><option value="">Pilih Provinsi</option></select>

        <label for="regency">Kota/Kabupaten</label>
        <select id="regency" name="regency"><option value="">Pilih Kota/Kabupaten</option></select>

        <label for="district">Kecamatan</label>
        <select id="district" name="district"><option value="">Pilih Kecamatan</option></select>

        <label for="village">Kelurahan/Desa</label>
        <select id="village" name="village"><option value="">Pilih Kelurahan/Desa</option></select>

        <label for="address">Alamat Lengkap</label>
        <textarea id="address" name="address" rows="4"></textarea>

        <button type="submit">Lanjut ke Pembayaran</button>
    </form>
</main>
<script>
    fetch("https://www.emsifa.com/api-wilayah-indonesia/api/provinces.json")
        .then(response => response.json())
        .then(data => {
            const provinceSelect = document.getElementById("province");
            data.forEach(province => {
                const option = document.createElement("option");
                option.value = province.id;
                option.textContent = province.name;
                provinceSelect.appendChild(option);
            });
        })
        .catch(error => console.error("Gagal mengambil data provinsi:", error));
</script>
{% endblock content %}
