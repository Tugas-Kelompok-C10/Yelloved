<!DOCTYPE html>
<html>
<head>
    <title>Checkout - Yelloved</title>
</head>
<body>

    <h1>Checkout</h1>

    <form>
        <h2>Alamat Pengiriman</h2>

        <label>Nama Penerima</label><br>
        <input type="text" name="recipient_name"><br><br>

        <label>Nomor HP</label><br>
        <input type="text" name="phone"><br><br>

        <label>Provinsi</label><br>
        <select id="province">
            <option value="">Pilih Provinsi</option>
        </select><br><br>

        <label>Kota/Kabupaten</label><br>
        <select id="regency">
            <option value="">Pilih Kota/Kabupaten</option>
        </select><br><br>

        <label>Kecamatan</label><br>
        <select id="district">
            <option value="">Pilih Kecamatan</option>
        </select><br><br>

        <label>Kelurahan/Desa</label><br>
        <select id="village">
            <option value="">Pilih Kelurahan/Desa</option>
        </select><br><br>

        <label>Alamat Lengkap</label><br>
        <textarea name="address"></textarea><br><br>

        <button type="submit">Lanjut ke Pembayaran</button>
    </form>

    <script>
    fetch("https://www.emsifa.com/api-wilayah-indonesia/api/provinces.json")
        .then(response => response.json())
        .then(data => {
            const provinceSelect = document.getElementById("province");

            data.forEach(province => {
                const option = document.createElement("option");

                option.value = province.id;
                option.textContent = province.name;

                provinceSelect.appendChild(option);
            });
        })
        .catch(error => {
            console.error("Gagal mengambil data provinsi:", error);
        });
</script>

</body>
</html>
