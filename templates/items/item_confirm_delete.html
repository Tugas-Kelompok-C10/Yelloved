{% extends "base.html" %}
{% load static items_ui %}
{% block meta %}<script src="{% static 'js/items/ui.js' %}" defer></script><title>Delete item | Yelloved</title><link rel="stylesheet" href="{% static 'css/explore.css' %}">{% endblock %}
{% block content %}
<main class="explore-page item-form-page" lang="en">
    <section class="item-form-panel"><h1>Delete item?</h1><p>The listing “{{ item.title }}” will be permanently deleted. This cannot be undone.</p>
        <form method="post" class="item-form">{% csrf_token %}<div class="explore-detail-actions"><button type="submit" class="explore-button">Yes, delete item</button><a class="explore-button explore-button-secondary" href="{{ item.get_absolute_url }}">Cancel</a></div></form>
    </section>
</main>
{% endblock %}
