<button type="button" class="item-favorite{% if item.is_favorited %} is-favorited{% endif %}" data-item-favorite="{{ item.pk }}" data-url="{% url 'items:toggle_favorite' item.pk %}" data-login-url="{% url 'login' %}?next={{ request.get_full_path|urlencode }}" data-authenticated="{{ user.is_authenticated|yesno:'true,false' }}" data-csrf="{{ csrf_token }}" aria-pressed="{{ item.is_favorited|yesno:'true,false' }}" aria-label="{% if item.is_favorited %}Remove from favorites{% else %}Save to favorites{% endif %}" title="{% if item.is_favorited %}Remove from favorites{% else %}Save to favorites{% endif %}">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>
</button>
