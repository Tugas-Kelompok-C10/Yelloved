<!-- Shared by the board modal and the inline detail panel. Sending remains a prototype. -->
<form class="wanted-form wanted-item-offer-form" data-item-offer-form data-draft-user="{{ user.pk|default:'guest' }}" enctype="multipart/form-data">
    <input type="hidden" name="wanted_post" value="{% if wanted_post.pk %}{{ wanted_post.pk }}{% else %}{{ wanted_post.slug }}{% endif %}">
    <fieldset{% if wanted_post and wanted_post.status != "open" %} disabled{% endif %}>
        <div class="wanted-form-field">
            <label for="offered-item-photo">Item photo <span class="wanted-required" aria-hidden="true">*</span></label>
            <input id="offered-item-photo" type="file" name="image" accept=".jpg,.jpeg,.png,.webp" data-offer-image required>
            <small class="wanted-form-help">JPG, JPEG, PNG, or WEBP; maximum 5 MB and 4096 × 4096 pixels.</small>
        </div>
        <div class="wanted-form-field">
            <label for="offered-item-price">Your price <span class="wanted-required" aria-hidden="true">*</span></label>
            <div class="wanted-offer-price-field"><span aria-hidden="true">Rp</span><input id="offered-item-price" type="number" name="price" min="0" step="1" inputmode="numeric" placeholder="150000" required></div>
        </div>
        <div class="wanted-form-field">
            <label for="offered-item-description">Message <span class="wanted-required" aria-hidden="true">*</span></label>
            <textarea id="offered-item-description" name="description" rows="4" maxlength="240" placeholder="Describe your item, its condition, and your pickup location." required></textarea>
        </div>
        <button class="wanted-button wanted-action-offer" type="submit" data-send-item-offer disabled>Send offer</button>
    </fieldset>
    {% if wanted_post and wanted_post.status != "open" %}<p class="wanted-form-help">This post is no longer accepting offers.</p>{% endif %}
    <a class="wanted-button wanted-action-secondary" href="{% url 'transactions:pesan' %}">Chat</a>
    <p class="wanted-form-help" data-offer-feedback role="status"></p>
</form>
